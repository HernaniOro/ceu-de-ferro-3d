<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Céu de Ferro 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Chakra+Petch:wght@600;700&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen cockpit. Slim status strip on top, the canvas fills the rest,
   and the hangar (aircraft picker) sits over a live battle until takeoff. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#12181a; --panel:#1b2427; --panel-2:#26333a; --line:#3d4e4c;
  --fg:#ece6d6; --mute:#9eaaa2;
  --accent:#e6b53a; --accent-ink:#1b1606;
  --foe:#e2604f; --friend:#6fc3b2;
  --f-display:'Saira Stencil One','Impact','Arial Narrow',sans-serif;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-data:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
body[data-era="modern"]{
  --accent:#63d2e6; --accent-ink:#04181c;
  --f-display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.bar .tag{font-family:var(--f-data);font-size:13px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-family:var(--f-data);font-size:13px;color:var(--fg);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.stage{position:relative;flex:1;min-height:0;background:var(--bg)}
#cv,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#hud{pointer-events:none}

.sheet{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,rgba(18,24,26,.55) 0%,rgba(18,24,26,.9) 34%,var(--bg) 100%)}
.sheet-in{max-width:1080px;margin:0 auto;padding-block:20px 28px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:18px}

/* hangar: three bands over the live battle. The top and the dock are solid enough to read, the middle is left open so the battle shows around
   the vehicle on the turntable; --haze is the era's backdrop */
.hg{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;--haze:rgba(230,181,58,.16);
  background:radial-gradient(120% 90% at 50% 46%,rgba(18,24,26,0) 30%,rgba(18,24,26,.62) 100%),linear-gradient(180deg,rgba(18,24,26,.82) 0,rgba(18,24,26,.18) 22%,rgba(18,24,26,.12) 64%,rgba(18,24,26,.9) 100%)}
.hg::before{content:'';position:absolute;inset:0;pointer-events:none;transition:opacity .5s;
  background:radial-gradient(70% 60% at 12% 100%,var(--haze),transparent 70%),repeating-linear-gradient(115deg,rgba(236,230,214,.035) 0 2px,transparent 2px 22px)}
body[data-era="modern"] .hg{--haze:rgba(99,210,230,.14)}
body[data-era="modern"] .hg::before{background:radial-gradient(70% 60% at 88% 0,var(--haze),transparent 70%),repeating-linear-gradient(180deg,rgba(99,210,230,.04) 0 1px,transparent 1px 5px)}
.hg>*{position:relative}
.hg-top{display:flex;align-items:stretch;gap:10px 14px;flex-wrap:wrap;padding:12px var(--gut-r) 0 var(--gut-l)}
.seg{display:flex;gap:6px;min-width:0}
.era,.tab{text-align:left;background:rgba(27,36,39,.78);border:1px solid var(--line);border-radius:3px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;
  transition:background-color .25s,border-color .25s,color .25s}
.era{flex:0 1 250px;padding:6px 16px 8px;position:relative;overflow:hidden}
.era b{font-weight:400;font-size:34px;line-height:1;letter-spacing:.04em;opacity:.62;transition:opacity .25s}
.era[data-era="ww2"] b{font-family:'Saira Stencil One','Impact',sans-serif;color:#e6b53a}
.era[data-era="modern"] b{font-family:'Chakra Petch','Arial Narrow',sans-serif;font-weight:700;color:#63d2e6}
.era span,.tab span{color:var(--mute);font-size:14px;line-height:1.25}
.era::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.era[aria-selected="true"]{background:rgba(38,51,58,.92);border-color:var(--accent)}
.era[aria-selected="true"] b{opacity:1}
.era[aria-selected="true"]::after{transform:none}
.tab b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.05em}
.tab[aria-selected="true"]{border-color:var(--accent);background:rgba(38,51,58,.92)}
.tab[aria-selected="true"] b{color:var(--accent)}
.mode-seg{flex:1 1 300px;justify-content:flex-end}
.mode-seg .tab{flex:0 1 190px}
.hg-top .chip{align-self:center;background:rgba(27,36,39,.78);padding:9px 14px}
.chip[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}

.hg-mid{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,min(27vw,470px));grid-template-rows:auto minmax(0,1fr);gap:8px 18px;padding:10px var(--gut-r) 10px var(--gut-l)}
.hg-mid>.cls{grid-column:1;grid-row:1}
.hg .fleet{display:contents}
.hg .car{grid-column:1;grid-row:2}
.hg .spec{grid-column:2;grid-row:1/3}
.hg-mid>.cls[hidden]+.fleet .car{grid-row:1/3}

/* the class strip, the carousel and the spec sheet: one component (fleet) for the hangar and, compact, for the picker of a match under way */
.cls{display:flex;gap:2px;justify-content:center;justify-self:center;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none;background:rgba(20,27,29,.72);border:1px solid var(--line);border-radius:3px;padding:3px 4px 0}
.cl{flex:0 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px 6px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:3px 3px 0 0;
  color:#c3cbc2;font-family:var(--f-data);font-size:12px;letter-spacing:.04em;transition:color .2s,border-color .2s,background-color .2s}
.cl svg{width:30px;height:30px;display:block;fill:currentColor;stroke:currentColor;stroke-width:0}
.cl:hover{color:var(--fg)}
.cl[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:linear-gradient(180deg,transparent,rgba(61,78,76,.45))}
.fleet{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,370px);gap:18px}
.car{position:relative;min-height:0;min-width:0;container-type:size;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.car-track:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:3px}
.car::after{content:'';position:absolute;left:50%;top:50%;width:min(64cqw,112cqh);height:min(11cqw,19cqh);transform:translate(-50%,calc(min(18cqw,32cqh) - 40%));border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(10,14,15,.5),rgba(10,14,15,.28) 62%,transparent 64%);box-shadow:0 0 0 1px var(--edge,rgba(236,230,214,.16)) inset}
.car-track{position:absolute;inset:0;overflow:hidden}
.slide{--off:0;position:absolute;left:50%;top:44%;width:min(74cqw,132cqh);aspect-ratio:16/9;padding:0;border:0;background:none;z-index:1;
  transform:translate(calc(-50% + var(--off) * min(46cqw,82cqh)),-50%) scale(.46);opacity:.62;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s;cursor:pointer}
.slide canvas{width:100%;height:100%;display:block;pointer-events:none}
.slide[aria-selected="true"]{transform:translate(-50%,-50%) scale(1);opacity:1;z-index:2;pointer-events:none}
.slide[data-far]{opacity:0;pointer-events:none}
.slide:not([aria-selected="true"]):hover{opacity:.95}
.car[data-drag]{cursor:grabbing}
.car[data-drag] .slide{transition:none}
.car-track[data-in] .slide{animation:slide-in .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes slide-in{from{opacity:0;transform:translate(calc(-50% + var(--off) * min(46cqw,82cqh)),-38%) scale(.4)}}
.car-nav{position:absolute;top:44%;z-index:3;width:44px;height:64px;margin-top:-32px;display:grid;place-items:center;background:rgba(27,36,39,.6);border:1px solid var(--line);border-radius:3px;color:var(--fg);padding:0}
.car-nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4}
.car-nav:hover{border-color:var(--accent);color:var(--accent)}
.car-nav.prev{left:0}.car-nav.next{right:0}
.car-nav[hidden]{display:none}
.plate{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none;padding:0 50px}
.plate .nm{font-family:var(--f-display);font-size:clamp(22px,4.4cqw,40px);line-height:1.02;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;text-shadow:0 2px 14px rgba(8,12,13,.9)}
.plate .role{font-size:15px;color:var(--fg);text-shadow:0 1px 8px rgba(8,12,13,.95);display:flex;flex-wrap:wrap;justify-content:center;gap:0 12px}
.plate .role i{font-style:normal;color:var(--mute)}
.dots{display:flex;gap:6px;margin-top:4px}
.dots i{width:16px;height:3px;background:var(--line);transition:background-color .3s,width .3s}
.dots i[data-on]{background:var(--accent);width:26px}

.spec{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;align-self:start;max-height:100%;display:flex;flex-direction:column;gap:12px;
  background:rgba(20,27,29,.8);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:3px;padding:12px 14px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .3s}
.spec h3{margin:0;font-family:var(--f-data);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--mute)}
.spec .line{font-family:var(--f-data);font-size:12.5px;color:var(--fg);margin:0}
.spec .note{margin:0;font-size:14.5px;color:var(--mute)}
.meters{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14.5px;color:var(--fg)}
.meter{height:7px;background:rgba(61,78,76,.7);border-radius:1px;overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1),background-color .3s}
.arms{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.arms li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:15px;line-height:1.2}
.arms svg{width:22px;height:22px;fill:var(--accent);stroke:var(--accent);stroke-width:0}
.arms li span i{font-style:normal;font-size:13.5px;color:var(--mute);margin-left:8px}

/* loadout: the named sets, then one row a hardpoint group, then what it all weighs against what the plane lifts */
.lo{display:flex;flex-direction:column;gap:8px}
.lo-sets{display:flex;flex-wrap:wrap;gap:5px}
.lo-sets button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;color:var(--fg);transition:background-color .2s,border-color .2s,color .2s}
.lo-sets button:hover{border-color:var(--accent)}
.lo-sets button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lo-g{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr) auto;gap:3px 8px;align-items:center}
.lo-g label{font-size:13.5px;line-height:1.15;color:var(--mute)}
.lo-g select{min-width:0;width:100%;font:inherit;font-size:14.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 6px}
.lo-g select:focus-visible,.step button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.step{display:grid;grid-template-columns:30px 34px 30px;align-items:center;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.step button{height:30px;border:0;background:transparent;font-family:var(--f-data);font-size:17px;line-height:1;padding:0}
.step button:disabled{color:var(--line);cursor:default}
.step output{text-align:center;font-family:var(--f-data);font-size:14px;font-variant-numeric:tabular-nums}
.lo-w{display:grid;gap:4px;font-family:var(--f-data);font-size:12.5px;color:var(--fg)}
.lo-w .meter{height:9px;position:relative;overflow:visible}
.lo-w .meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.75}
.lo-w span{display:flex;justify-content:space-between;gap:8px}
.lo-w em{font-style:normal;color:var(--mute)}
.lo-no{margin:0;font-size:14px;color:var(--mute)}

.hg-dock{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px 18px;align-items:center;padding:10px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:linear-gradient(180deg,rgba(18,24,26,0),rgba(18,24,26,.86) 40%)}
.hg-dock p{margin:0;color:var(--fg);font-size:15.5px;max-width:74ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(8,12,13,.9)}
.launch{background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:13px 30px;font-family:var(--f-display);font-size:24px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:background-color .3s,filter .15s}
.launch:hover{filter:brightness(1.1)}
.launch:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.net{display:grid;grid-template-columns:auto minmax(120px,190px);gap:2px 8px;align-items:center}
.net label{font-size:13.5px;color:var(--mute)}
.net input{font-family:var(--f-data);font-size:16px;background:rgba(27,36,39,.9);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:7px 9px;min-width:0;width:100%}
.net input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.net p{grid-column:1/-1;font-family:var(--f-data);font-size:12.5px;color:var(--accent);min-height:1.2em;-webkit-line-clamp:2}

/* Controles: the control scheme, the keys of the vehicle chosen and what the mission is, opened on demand over the right edge */
.kp{position:absolute;top:0;right:0;bottom:0;z-index:5;width:min(470px,100%);display:flex;flex-direction:column;background:rgba(20,27,29,.985);border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(8,12,13,.5);animation:kp-in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes kp-in{from{transform:translateX(40px);opacity:0}}
.kp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.kp h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.kp-body{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px}
.kp-body .seg .tab{flex:1 1 0}
.kp-body>p{margin:0;color:var(--mute);font-size:15px;max-width:60ch}
.keys{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:7px 14px;margin:0;font-size:15px}
.keys dt{font-family:var(--f-data);font-size:13px;color:var(--accent);max-width:15ch}
.keys dd{margin:0;color:var(--fg)}

.over .sheet-in{align-items:flex-start;padding-block:10vh 28px;max-width:560px}
.over h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,52px);text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.tally{display:grid;grid-template-columns:auto auto;gap:4px 24px;margin:0;font-family:var(--f-data);font-size:18px;font-variant-numeric:tabular-nums}
.tally dt{color:var(--mute)} .tally dd{margin:0;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:10px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:12px 16px;font-family:var(--f-data);font-size:15px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.pick{position:absolute;inset:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:10px var(--gut-r) 10px var(--gut-l);background:rgba(18,24,26,.42)}
.pick[data-dead]{align-items:flex-end;background:none}
.pick-in{width:min(760px,100%);margin:auto 0;background:rgba(20,27,29,.93);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pick[data-dead] .pick-in{margin:auto 0 0}
.pick h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.pick p{margin:0;color:var(--fg);font-size:15px}
.pick p.hint{font-family:var(--f-data);font-size:12px;color:var(--mute)}
.pick p[data-no]{color:var(--foe)}
.pick .cls{justify-content:flex-start;justify-self:start;align-self:flex-start;background:none;border:0;padding:0}
.pick .cl{min-width:58px;padding:3px 8px 4px;font-size:11px}
.pick .cl svg{width:24px;height:24px}
.pick .fleet{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;height:clamp(210px,40vh,330px)}
.pick .slide{width:min(92cqw,150cqh);top:42%}
.pick .plate .nm{font-size:clamp(17px,5cqw,24px)}
.pick .plate .role{font-size:13px}
.pick .plate{padding:0 46px}
.pick .car-nav{width:36px;height:52px;margin-top:-26px}
.pick .spec{padding:9px 11px 10px;gap:9px;background:rgba(27,36,39,.6);backdrop-filter:none;-webkit-backdrop-filter:none;border-top-width:1px;border-top-color:var(--line)}
.pick .spec .note,.pick .spec .line,.pick .spec div:has(+.lo:not([hidden])){display:none}
.pick .meters{font-size:13.5px;gap:4px 8px}
.pick .arms li{font-size:14px}
.pick .launch{font-size:18px;padding:10px 14px;flex:1 1 220px;white-space:normal}
.pick .ghost{padding:9px 14px}
.pick:not([hidden])~.touch{display:none}
/* where to enter: the list is filled by drawSpawn */
.spawn{display:flex;gap:10px;align-items:flex-start}
.spawn canvas{width:132px;height:auto;flex:none;border:1px solid var(--line)}
.spawn-list{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.spawn-list::before{content:attr(aria-label);flex:1 0 100%;font-size:13px;color:var(--mute)}
.spawn-list button{flex:1 1 220px;font:inherit;font-size:14px;text-align:left;padding:6px 9px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:3px}
.spawn-list button[aria-checked="true"]{border-color:var(--accent);color:var(--accent)}
.spawn-list button:disabled{color:var(--mute);cursor:default}
@media (max-width:520px){.spawn canvas{width:84px}}
.touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));pointer-events:none;user-select:none;-webkit-user-select:none}
.touch div{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:48%}
.touch div:first-child{justify-content:flex-start}
.touch button{pointer-events:auto;touch-action:none;min-width:58px;height:58px;border-radius:50%;border:1px solid var(--line);
  background:rgba(27,36,39,.72);font-family:var(--f-data);font-size:13px;color:var(--fg)}
.touch button.big{min-width:72px;height:72px;border-color:var(--accent);color:var(--accent)}

    </div>
  </main>
